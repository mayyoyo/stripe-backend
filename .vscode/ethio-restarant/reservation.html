<!-- Reservation Form Card -->
<section class="cards-container">
  <div class="card">
    <h3 data-en="Reservation Form" data-am="የሰሌዳ ቅጽ">Reservation Form</h3>
    <form id="reservationForm">
      <label data-en="Your Name" data-am="ስም" for="name"></label>
      <input type="text" id="name" name="name" placeholder="Your Name" data-en="Your Name" data-am="ስም" required>

      <label data-en="Email" data-am="ኢሜይል" for="email"></label>
      <input type="email" id="email" name="email" placeholder="Your Email" data-en="Your Email" data-am="ኢሜይል" required>

      <label data-en="Phone" data-am="ስልክ" for="phone"></label>
      <input type="tel" id="phone" name="phone" placeholder="Phone Number" data-en="Phone Number" data-am="ስልክ" required>

      <label data-en="Date" data-am="ቀን" for="date"></label>
      <input type="date" id="date" name="date" required>

      <label data-en="Time" data-am="ሰዓት" for="time"></label>
      <input type="time" id="time" name="time" required>

      <label data-en="Guests" data-am="እንግዶች" for="guests"></label>
      <input type="number" id="guests" name="guests" placeholder="Number of Guests" data-en="Number of Guests" data-am="እንግዶች" required>

      <button class="btn" type="submit" data-en="Reserve Now" data-am="አሁን ይያዙ">Reserve Now</button>
    </form>
  </div>
</section>
