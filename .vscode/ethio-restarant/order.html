<!-- ORDER CART -->
<section class="section-box">
  <h2 data-en="Your Cart" data-am="ጋርታዎ">Your Cart</h2>
  <div id="cart-items">
    <!-- JS populates items -->
  </div>
  <p><strong data-en="Total:" data-am="ጠቅላላ፡"></strong> $<span id="orderTotal">0.00</span></p>
</section>

<!-- PAYMENT FORM -->
<section class="section-box">
  <h2 data-en="Payment" data-am="ክፍያ">Payment</h2>
  <form id="paymentForm">
    <label data-en="Cardholder Name" data-am="የካርድ ባለቤት ስም"></label>
    <input type="text" id="cardName" placeholder="Your Name" required>

    <label data-en="Card Number" data-am="የካርድ ቁጥር"></label>
    <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" required>

    <label data-en="Expiration Date" data-am="የማስተናገድ ቀን"></label>
    <input type="text" id="expDate" placeholder="MM/YY" required>

    <label data-en="CVV" data-am="አረጋግጥ ኮድ"></label>
    <input type="text" id="cvv" placeholder="123" required>

    <button type="submit" class="btn" data-en="Place Order" data-am="ትዕዛዝ ያስገቡ">Place Order</button>
  </form>
</section>
