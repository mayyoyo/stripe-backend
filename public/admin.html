<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Mobile Notary Bookings</title>
<link rel="stylesheet" href="css/style.css">
<style>
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
  th { background: #2563eb; color: #fff; }
  tr:nth-child(even) { background: #f4f4f4; }
  .paid { color: green; font-weight: bold; }
  .unpaid { color: red; font-weight: bold; }
</style>
</head>
<body>

<header>
  <div class="navbar">
    <div class="logo">Mobile Notary VA - Admin</div>
  </div>
</header>

<section class="hero">
  <h1>All Bookings</h1>
</section>

<section>
  <table id="bookings-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Deposit</th>
        <th>Services</th>
        <th>Date</th>
        <th>Time</th>
        <th>Paid</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<script>
async function loadBookings() {
  try {
    const res = await fetch('http://localhost:4242/bookings');
    const bookings = await res.json();

    const tbody = document.querySelector('#bookings-table tbody');
    tbody.innerHTML = '';

    bookings.forEach(b => {
      const services = b.selectedServices?.map(
        s => `${s.service} x${s.quantity}`
      ).join(', ') || '';

      tbody.innerHTML += `
        <tr>
          <td>${b.customerName}</td>
          <td>${b.customerEmail}</td>
          <td>$${b.depositAmount}</td>
          <td>${services}</td>
          <td>${b.date || ''}</td>
          <td>${b.time || ''}</td>
          <td class="${b.paid ? 'paid' : 'unpaid'}">
            ${b.paid ? 'Yes' : 'No'}
            ${!b.paid ? `<button onclick="markPaid('${b.customerEmail}')">Mark as Paid</button>` : ''}
          </td>
        </tr>
      `;
    });
  } catch (err) {
    console.error(err);
    alert('Failed to load bookings');
  }
}

async function markPaid(email) {
  if (!confirm('Mark this booking as paid?')) return;

  try {
    const res = await fetch(`http://localhost:4242/bookings/${email}/mark-paid`, {
      method: 'POST'
    });
    const data = await res.json();

    if (data.success) {
      alert(data.message);
      loadBookings(); // refresh table
    } else {
      alert('Error: ' + data.error);
    }
  } catch (err) {
    console.error(err);
    alert('Failed to mark as paid');
  }
}

// Load bookings when page opens
loadBookings();
</script>

<!--  -->
<script>
  const hamburger = document.querySelector(".hamburger");
  const navLinks = document.querySelector(".nav-links");

  hamburger.addEventListener("click", () => {
    hamburger.classList.toggle("open");
    navLinks.classList.toggle("active");
  });
</script>
<!--  -->
</body>
</html>
